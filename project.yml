name: SpaceInvaders
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"
targets:
  SpaceInvaders:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.SpaceInvaders
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleName: Space Invaders
        CFBundleDisplayName: Space Invaders
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.arcade-games
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat"
        SUFeedURL: https://raw.githubusercontent.com/vincentlauriat/SpaceInvaders/main/appcast.xml
        SUPublicEDKey: mzpzGs9uFpTOCv2NacUqekZc0yRfTP0gyGrtOikqEjE=
